[package]
name = "arrowspace"
version = "0.27.4"
edition = "2024"
description = "Graph Wiring for embeddings using physical networks wiring. Provides graph analysis, vector search and a energy-distribution stats."
authors = ["Lorenzo <tunedconsulting@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tuned-org-uk/arrowspace-rs"
homepage = "https://tuned-org-uk.github.io/"
documentation = "https://docs.rs/arrowspace-rs"
readme = "README.md"
keywords = ["vector-search", "spectral-analysis", "graph-signal", "similarity-search", "machine-learning"]
categories = ["algorithms", "mathematics", "science"]
exclude = [
    "target/*",
    "Cargo.lock",
    ".git/*",
    ".github/*",
    "*.tmp",
    "*.md",
    "*.bib",
    "*.cff",
    "test_data/*",
    "examples/*"
]

[dependencies]
rand = "0.10.2"
smartcore = {version = "0.6.14"}
ordered-float = "5.1.0"
rayon = "1.11.0"
sprs = "0.11.4"
approx = "0.5.1"
log = "0.4.28"
env_logger = "0.11.8"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"

# storage feature
parquet = { version = "59.2.0", optional = true}
uuid = { version = "1.20.0", features = ["v4", "serde"], optional = true }
arrow = { version = "59.2.0", optional = true }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = { version = "^1.0.149", optional = true }
chrono = { version = "0.4.42", optional = true }
csv = { version = "1.4.0", optional = true }

[dev-dependencies]
criterion = "0.8.1"
smartcore = {version = "0.6.14", features = ["datasets"]}
rand_pcg = "0.10.2"
tempfile = "3.24.0"
rand_xoshiro = "0.8.1"
serial_test = "4.0"
once_cell = "1.19"

[features]
default = []
storage = ["dep:parquet", "dep:uuid", "dep:arrow", "dep:serde_json", "dep:chrono", "dep:csv"]

[lib]
name = "arrowspace"
crate-type = ["rlib"]

[examples]

[workspace]

[[bench]]
name = "index_compute_bench"
harness = false
